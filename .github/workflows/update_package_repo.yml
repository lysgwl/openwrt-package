name: Update Repo Package

on:
  push:
    branches:
      - master      # 指定在对master分支进行push时触发
  schedule:
    - cron: '0 0 */3 * *'
    # 每5分钟运行一次 (cron: '*/5 * * * *')
    # 每天凌晨运行 (0 0 * * *) 
    # 每周执行一次 (0 0 * * 0)
    # 每15天执行 (0 0 */15 * *)
    # 每3天执行 (0 0 */3 * *)
  repository_dispatch:
  workflow_dispatch:
  
permissions:
  contents: write
  
env:
  REPO_OTHER_COND: 1
  REPO_REMOTE_COND: 0
  SCRIPT_NAME: update_scripts.sh
  SYSTEM_DIR: system-utils
  SCRIPT_ROOT: ${{ github.workspace }}/.github/scripts
  SYSTEM_REPO: git@github.com:lysgwl/system-utils.git
  
jobs:
  build:   # update build repo-sync
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout master branch
      uses: actions/checkout@v7
      with:
        ref: master
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "=== INITIALIZE BUILD ENVIRONMENT ==="
        
        UPDATE_SCRIPT="${SCRIPT_ROOT}/${SCRIPT_NAME}"
        SYSTEM_ROOT="${SCRIPT_ROOT}/${SYSTEM_DIR}"
        
        # 当前仓库地址
        REPO_URL="git@github.com:${GITHUB_REPOSITORY}.git"
        
        if [ ! -e "${UPDATE_SCRIPT}" ]; then
            echo "[ERROR] 更新脚本不存在: ${UPDATE_SCRIPT}"
            exit 1
        fi
        
        # 设置可执行权限
        chmod +x "${UPDATE_SCRIPT}"
        
        # 创建脚本目录
        mkdir -p "$SCRIPT_ROOT"
        
        # 磁盘信息
        echo "磁盘信息:"
        df -hT
        
        echo "SYSTEM_ROOT=${SYSTEM_ROOT}" >> "${GITHUB_ENV}"
        echo "UPDATE_SCRIPT=${UPDATE_SCRIPT}" >> "${GITHUB_ENV}"
        echo "REPO_URL=${REPO_URL}" >> "${GITHUB_ENV}"
        
    - name: Set SSH key and known_hosts
      uses: webfactory/ssh-agent@v0.10.0   # appleboy/ssh-action@master
      with:
        ssh-private-key: ${{ secrets.PERSONAL_SSH_KEY }}
        
    - name: Setup git config
      run: |
        git config --global user.name "lysgwl"
        git config --global user.email "lysgwl@163.com"
        git config --global init.defaultBranch main
        
    - name: Clone system-utils repository
      run: |
        echo "=== CLONE SYSTEM UTILS ==="
        if [[ ! -d "${SYSTEM_ROOT}" ]]; then
            git clone \
                --depth 1 \
                --branch master \
                "${SYSTEM_REPO}" \
                "${SYSTEM_ROOT}"
        fi
        
    - name: Update other packages
      if: env.REPO_OTHER_COND != 0 && !cancelled()
      run: |
        echo "=== UPDATE OTHER REPOSITORIES ==="
        OTHER_PACKAGE_ROOT="${GITHUB_WORKSPACE}/otherpackage"
       
        # 加载更新脚本
        source "${UPDATE_SCRIPT}"
        
        update_other_package "${OTHER_PACKAGE_ROOT}"
        
    - name: Update remote packages
      if: env.REPO_REMOTE_COND != 0 && !cancelled()
      run: |
        echo "=== UPDATE REMOTE REPOSITORIES ==="
        REMOTE_PACKAGE_ROOT="${GITHUB_WORKSPACE}/remotepackage"
        
         # 加载更新脚本
        source "${UPDATE_SCRIPT}"
        
        update_remote_repo "${REMOTE_PACKAGE_ROOT}"
        
    - name: Commit and push repository
      run: |
        echo "=== Commit AND PUSHING CHANGES ==="
        
        # 加载更新脚本
        source "${UPDATE_SCRIPT}"
        
        check_git_commit \
            "Auto update packages [skip ci]" \
            "otherpackage" \
            "remotepackage"
        echo "test3"
            
    - name: Delete workflow runs
      if: always()
      uses: Mattraks/delete-workflow-runs@v2  # main
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 0          # 全部删除只留正在跑的一条
        keep_minimum_runs: 0    # 全部删除只留正在跑的一条